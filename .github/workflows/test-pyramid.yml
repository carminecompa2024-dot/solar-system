name: Test Pyramid Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  # Base of Pyramid: Unit Tests
  # Fast, isolated tests that make up the largest portion of the test suite
  unit-tests:
    name: Unit Tests (Base Layer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

      - name: Archive Unit Test Results
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: test-results.xml

  # Middle of Pyramid: Integration Tests
  # Tests that verify components work together, includes code coverage
  integration-tests:
    name: Integration Tests (Middle Layer)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Integration Tests with Coverage
        run: npm run coverage

      - name: Archive Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: |
            coverage/
            coverage.json

  # Top of Pyramid: End-to-End/Smoke Tests
  # Fewer tests that validate critical user journeys and system health
  e2e-smoke-tests:
    name: E2E & Smoke Tests (Top Layer)
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Start Application
        run: |
          npm start &
          sleep 5
        env:
          MONGO_URI: mongodb://localhost:27017/solar-system
          MONGO_USERNAME: test
          MONGO_PASSWORD: test

      - name: Run Smoke Tests
        run: |
          echo "Running smoke tests to verify critical endpoints..."
          curl -f http://localhost:3000/live || exit 1
          curl -f http://localhost:3000/ready || exit 1
          curl -f http://localhost:3000/os || exit 1
          echo "All smoke tests passed!"

      - name: Archive Smoke Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-test-results
          path: test-results/

  # Summary Job: Report overall test pyramid results
  test-pyramid-summary:
    name: Test Pyramid Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-smoke-tests]
    if: always()
    steps:
      - name: Test Pyramid Summary
        run: |
          echo "=========================================="
          echo "        TEST PYRAMID RESULTS"
          echo "=========================================="
          echo "✓ Unit Tests (Base Layer): Completed"
          echo "✓ Integration Tests (Middle Layer): Completed"
          echo "✓ E2E/Smoke Tests (Top Layer): Completed"
          echo "=========================================="
          echo "All test pyramid layers executed successfully!"
